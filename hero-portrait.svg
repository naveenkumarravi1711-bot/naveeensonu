<svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e0ac69;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d49e5d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#aaddff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#88ccff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background behind person (optional, mostly transparent) -->
  
  <!-- Body/Shirt -->
  <path d="M50 500 L50 400 Q50 350 100 350 L300 350 Q350 350 350 400 L350 500 Z" fill="url(#shirt)" />
  
  <!-- Neck -->
  <rect x="160" y="300" width="80" height="60" fill="url(#skin)" />
  
  <!-- Head -->
  <ellipse cx="200" cy="240" rx="70" ry="90" fill="url(#skin)" />
  
  <!-- Hair -->
  <path d="M130 220 Q130 150 200 150 Q270 150 270 220 Q270 240 260 250 L260 220 Q260 170 200 170 Q140 170 140 220 L140 250 Q130 240 130 220 Z" fill="#333" />
  
  <!-- Eyes -->
  <circle cx="175" cy="230" r="5" fill="#333" />
  <circle cx="225" cy="230" r="5" fill="#333" />
  
  <!-- Beard (stubble) -->
  <path d="M140 260 Q200 320 260 260 Q260 290 200 330 Q140 290 140 260" fill="rgba(0,0,0,0.1)" />
  
</svg>
